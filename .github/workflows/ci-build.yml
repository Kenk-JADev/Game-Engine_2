# =============================================================================
# AetherRPG Maker – Continuous Integration
# =============================================================================
# WICHTIG: ${{ matrix.build_type }} darf NICHT zu Markdown-Links werden.
# Beim Einfügen in GitHub: als Raw/Plain Text speichern.
# =============================================================================
name: CI
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
jobs:
  # ---------------------------------------------------------------------------
  # Linux – Full stack (GLFW, OpenGL, miniaudio, ImGui, optional mruby)
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        include:
          - build_type: Debug
            extra_flags: "-DAETHER_ENABLE_ASAN=OFF"
          - build_type: Release
            extra_flags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install system packages
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            pkg-config \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            ruby \
            ruby-dev \
            rake \
            bison \
            g++ \
            xvfb \
            libasound2-dev \
            libpulse-dev
      - name: CMake configure
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DAETHER_BUILD_EDITOR=ON \
            -DAETHER_BUILD_RUNTIME=ON \
            -DAETHER_BUILD_TESTS=ON \
            -DAETHER_WITH_GLFW=ON \
            -DAETHER_WITH_OPENGL=ON \
            -DAETHER_WITH_MINIAUDIO=ON \
            -DAETHER_WITH_STB=ON \
            -DAETHER_WITH_MRUBY=ON \
            ${{ matrix.extra_flags }}
      - name: Build
        run: |
          set -euxo pipefail
          cmake --build build --config ${{ matrix.build_type }} --verbose 2>&1 | tee build.log
          # cmake --build already fails non-zero on compile/link errors
      - name: Show build errors on failure
        if: failure()
        run: |
          echo "======== BUILD LOG (tail) ========"
          tail -n 200 build.log || true
          echo "======== COMPILE ERRORS ========"
          grep -nE 'error:|fatal error:|undefined reference|ld returned|FAILED:' build.log || true
      - name: Unit & smoke tests (headless)
        run: |
          set -euxo pipefail
          ctest --test-dir build -C ${{ matrix.build_type }} \
            --output-on-failure --timeout 120 2>&1 | tee ctest.log
      - name: Show test failures on failure
        if: failure()
        run: |
          echo "======== CTEST LOG ========"
          cat ctest.log || true
          echo "======== FAILED TESTS ========"
          grep -nE 'FAILED|error:|CHECK failed|Segmentation|Abort' ctest.log || true
      - name: Runtime smoke under Xvfb
        if: matrix.build_type == 'Release'
        run: |
          set -euxo pipefail
          # Prefer real window path under Xvfb; fall back to headless only if Xvfb missing
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a ./build/bin/Game \
              --project samples/demo_project \
              --max-frames 30
          else
            ./build/bin/Game \
              --project samples/demo_project \
              --headless --max-frames 30
          fi
      - name: Editor smoke under Xvfb
        if: matrix.build_type == 'Release'
        run: |
          set -euxo pipefail
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a ./build/bin/AetherEditor \
              --gui --new "$RUNNER_TEMP/ci_game" --testplay --max-frames 10
          else
            ./build/bin/AetherEditor \
              --headless --new "$RUNNER_TEMP/ci_game" --testplay --max-frames 5
          fi
      - name: Upload Linux binaries
        if: matrix.build_type == 'Release' && success()
        uses: actions/upload-artifact@v4
        with:
          name: aether-linux-x64
          path: |
            build/bin/Game
            build/bin/AetherEditor
            build/bin/assets/
            build/bin/templates/
            samples/demo_project/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.build_type }}-failure-logs
          path: |
            build.log
            ctest.log
            build/Testing/**/*.log
          if-no-files-found: ignore
          retention-days: 7
  # ---------------------------------------------------------------------------
  # Linux headless-only (no X11) – verifies Null backends always work
  # ---------------------------------------------------------------------------
  linux-headless:
    name: Linux Headless (Null backends)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git
      - name: Configure without GLFW
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAETHER_WITH_GLFW=OFF \
            -DAETHER_WITH_OPENGL=OFF \
            -DAETHER_WITH_MRUBY=OFF \
            -DAETHER_BUILD_TESTS=ON
      - name: Build & test
        run: |
          set -euxo pipefail
          cmake --build build 2>&1 | tee build.log
          ctest --test-dir build --output-on-failure --timeout 120 2>&1 | tee ctest.log
      - name: Show errors on failure
        if: failure()
        run: |
          echo "======== BUILD LOG (tail) ========"
          tail -n 200 build.log || true
          grep -nE 'error:|fatal error:|undefined reference|FAILED:|CHECK failed' build.log ctest.log || true
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-headless-failure-logs
          path: |
            build.log
            ctest.log
          if-no-files-found: ignore
          retention-days: 7
  # ---------------------------------------------------------------------------
  # Windows (MSVC)
  # ---------------------------------------------------------------------------
  windows:
    name: Windows MSVC (${{ matrix.build_type }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DAETHER_BUILD_TESTS=ON `
            -DAETHER_WITH_GLFW=ON `
            -DAETHER_WITH_OPENGL=ON `
            -DAETHER_WITH_MINIAUDIO=ON `
            -DAETHER_WITH_STB=ON `
            -DAETHER_WITH_MRUBY=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed with $LASTEXITCODE" }
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config ${{ matrix.build_type }} --parallel -- /v:m
          if ($LASTEXITCODE -ne 0) { throw "Build failed with $LASTEXITCODE" }
      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build -C ${{ matrix.build_type }} `
            --output-on-failure --timeout 180
          if ($LASTEXITCODE -ne 0) { throw "ctest failed with $LASTEXITCODE" }
      - name: Upload Windows binaries
        if: matrix.build_type == 'Release' && success()
        uses: actions/upload-artifact@v4
        with:
          name: aether-windows-x64
          path: |
            build/bin/Game.exe
            build/bin/AetherEditor.exe
            build/bin/assets/
            build/bin/templates/
            samples/demo_project/
          if-no-files-found: warn
          retention-days: 14
  # ---------------------------------------------------------------------------
  # macOS (best-effort, but real failures still show; only brew install soft)
  # ---------------------------------------------------------------------------
  macos:
    name: macOS
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install cmake ninja || true
      - name: Configure & build
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAETHER_BUILD_TESTS=ON \
            -DAETHER_WITH_GLFW=ON \
            -DAETHER_WITH_OPENGL=ON \
            -DAETHER_WITH_MRUBY=OFF
          cmake --build build 2>&1 | tee build.log
          ctest --test-dir build --output-on-failure --timeout 180 2>&1 | tee ctest.log
      - name: Show errors on failure
        if: failure()
        run: |
          tail -n 200 build.log || true
          grep -nE 'error:|fatal error:|FAILED:|CHECK failed' build.log ctest.log || true

