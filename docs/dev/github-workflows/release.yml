# =============================================================================
# Optional release packaging when a version tag is pushed (v*)
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev ruby ruby-dev bison libasound2-dev

      - name: Build Release
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAETHER_WITH_GLFW=ON \
            -DAETHER_WITH_OPENGL=ON \
            -DAETHER_WITH_MINIAUDIO=ON \
            -DAETHER_WITH_STB=ON \
            -DAETHER_WITH_MRUBY=ON \
            -DAETHER_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          STAGE=dist/AetherRPG-linux-x64
          mkdir -p "$STAGE"
          cp -a build/bin/Game build/bin/AetherEditor "$STAGE/"
          cp -a build/bin/assets "$STAGE/" 2>/dev/null || true
          cp -a build/bin/templates "$STAGE/" 2>/dev/null || true
          cp -a samples/demo_project "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          (cd dist && tar -czf AetherRPG-linux-x64.tar.gz AetherRPG-linux-x64)

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/AetherRPG-linux-x64.tar.gz

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DAETHER_WITH_GLFW=ON `
            -DAETHER_WITH_OPENGL=ON `
            -DAETHER_WITH_MINIAUDIO=ON `
            -DAETHER_WITH_STB=ON `
            -DAETHER_WITH_MRUBY=OFF `
            -DAETHER_BUILD_TESTS=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $stage = "dist/AetherRPG-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/bin/Game.exe $stage
          Copy-Item build/bin/AetherEditor.exe $stage
          if (Test-Path build/bin/assets) { Copy-Item build/bin/assets $stage -Recurse }
          if (Test-Path build/bin/templates) { Copy-Item build/bin/templates $stage -Recurse }
          Copy-Item samples/demo_project $stage -Recurse
          Copy-Item README.md,LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath dist/AetherRPG-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/AetherRPG-windows-x64.zip

  publish:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release-linux/*
            artifacts/release-windows/*
          generate_release_notes: true
